name: Probe token permissions
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo '--- try create release for EXISTING tag v0.0.0-rc1 (draft) ---'
          gh api -X POST repos/davidef02/proxi/releases -f tag_name=v0.0.0-rc1 -f name='__probe__' -F draft=true 2>&1 | head -c 400; echo
          echo '--- cleanup if created ---'
          id=$(gh api repos/davidef02/proxi/releases/tags/v0.0.0-rc1 --jq '.id // empty' 2>/dev/null)
          echo "release id: $id"
          if [ -n "$id" ] && [ "$id" != "null" ]; then gh api -X DELETE "repos/davidef02/proxi/releases/$id" && echo DELETED; fi
