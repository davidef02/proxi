name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck:app
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - run: cargo build --release --locked
      - run: npm run app:build # test:app expects app/web/dist
      - run: npm run test:app # needs the binary built first
      - run: npm run test:rust # ported HTTP/SSE tests against target/release/proxi
      # also the test browser of the Rust render tests (PROXI_TEST_BROWSER)
      - run: npx playwright install --with-deps chromium
      - name: cargo test
        run: |
          PROXI_TEST_BROWSER="$(node -p "require('playwright-core').chromium.executablePath()")"
          test -f "$PROXI_TEST_BROWSER" || { echo "::error::Playwright Chromium not found at '$PROXI_TEST_BROWSER'"; exit 1; }
          export PROXI_TEST_BROWSER
          cargo test --locked
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read # the action lists the PR commits to pick the scan range
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: 8.30.1 # the action defaults to 8.24.3, which predates [[allowlists]]
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_COMMENTS: false
