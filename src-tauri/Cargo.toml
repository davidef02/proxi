[package]
name = "proxi-app"
version = "0.1.0"
edition = "2021"
publish = false

# Standalone crate: the root `cargo build --locked` / `cargo test --locked` (CI, ubuntu,
# no webkit2gtk) must never compile Tauri, so the shell stays out of the repo workspace.
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2.5.5"
tauri-plugin-clipboard-manager = "2.5.0"
tauri-plugin-opener = "2.7.3"
tauri-plugin-window-controls-overlay = "0.1.0"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "rustls", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
regex = "1.13.1"
