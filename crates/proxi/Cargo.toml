[package]
name = "proxi"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
publish = false

[dependencies]
axum = "0.8.9"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
clap = { version = "4.6.7", features = ["derive"] }
tower-http = { version = "0.7.1", features = ["fs"] }
futures-util = { version = "0.3.34", default-features = false, features = ["alloc"] }
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "rustls"] }
keyring = "4.2.0"
aes-gcm = "0.10.3"
sha1 = "0.10.7"
base64 = "0.23.1"
gethostname = "1.1.0"
indexmap = { version = "2.14.2", features = ["serde"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }
